name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces one that is still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # a failing test stops the deploy, so the live game is never a broken one
      - name: Test
        run: npm run test:run
      # `npm run build` type-checks with tsc first, then builds with Vite
      - name: Build
        run: npm run build
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
